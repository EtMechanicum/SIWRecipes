<!DOCTYPE html>
<html>
	<head>
		<title>User list</title>
		<link rel="stylesheet" href="/css/navbar.css">
		<link rel="stylesheet" href="/css/admin/users.css">
	</head>

	<body>
		<div th:replace="~{fragments/navbar :: navbar}"></div>
		<hr>

		<main class="users-page">
			<h1>User management</h1>

			<section th:if="${users}" class="users-list">
				<ul>
					<li class="user-card" th:each="item : ${users}">
						<div class="user-info">
							<a class="username"
							   th:href="@{/admin/users/{user_name}(user_name=${item.username})}"
							   th:text="${item.username}">
								Username
							</a>
							<span class="status"
							      th:text="|Status: ${item.enabled}|">
								Status
							</span>
						</div>
					</li>
				</ul>
			</section>

			<h2 th:if="!${users}" class="empty">
				No users registered 👤
			</h2>
		</main>
	</body>
</html>
