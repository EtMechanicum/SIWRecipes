<!DOCTYPE html>

<html>
	<head>
		<title>Registration</title>
		<link rel="stylesheet" href="/css/navbar.css">
		<link rel="stylesheet" href="/css/registrationForm.css">
	</head>
	
	<body>

		<div th:replace="~{fragments/navbar :: navbar}"></div>

		<div class="registration-page">

			<h1>Registration</h1>

			<section class="registration-section">

				<form class="registration-form"
				      th:action="@{/register}"
				      method="post">

					<div class="form-row">
						<label>
							Name
							<input type="text" th:field="${newUser.name}">
							<span class="error"
							      th:if="${#fields.hasErrors('newUser.name')}"
							      th:errors="${newUser.name}"></span>
						</label>

						<label>
							Surname
							<input type="text" th:field="${newUser.surname}">
							<span class="error"
							      th:if="${#fields.hasErrors('newUser.surname')}"
							      th:errors="${newUser.surname}"></span>
						</label>

						<label>
							Email
							<input type="email" th:field="${newUser.email}">
							<span class="error"
							      th:if="${#fields.hasErrors('newUser.email')}"
							      th:errors="${newUser.email}"></span>
						</label>
					</div>

					<div class="form-row">
						<label>
							Username
							<input type="text" th:field="${newCredentials.username}">
							<span class="error"
							      th:if="${#fields.hasErrors('newCredentials.username')}"
							      th:errors="${newCredentials.username}"></span>
						</label>

						<label>
							Password
							<input type="password" th:field="${newCredentials.password}">
							<span class="error"
							      th:if="${#fields.hasErrors('newCredentials.password')}"
							      th:errors="${newCredentials.password}"></span>
						</label>
					</div>

					<button class="register-btn">Register</button>

				</form>

			</section>

		</div>

	</body>
</html>
